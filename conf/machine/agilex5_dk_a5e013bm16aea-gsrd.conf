#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex5
#@DESCRIPTION: Additional machine configuration for the Agilex5 SoCFPGA

IMAGE_TYPE:agilex5_dk_a5e013bm16aea ?= "gsrd"

UBOOT_CONFIG:agilex5_dk_a5e013bm16aea ?= "agilex5_dk_a5e013bm16aea-socdk-atf"

KERNEL_DEVICETREE = " "

64MB_QSPI_BUILD ?= "0"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:agilex5_dk_a5e013bm16aea = "${@' kernel-modules device-tree hw-ref-design' if d.getVar('64MB_QSPI_BUILD') != '1' else ''}"
EXTRA_IMAGEDEPENDS:append:agilex5_dk_a5e013bm16aea = "${@' u-boot-socfpga-scr' if d.getVar('64MB_QSPI_BUILD') != '1' else ''}"

IMAGE_BOOT_FILES:agilex5_dk_a5e013bm16aea = " \
		boot.scr.uimg \
		u-boot.itb \
		kernel.itb \
		"
HYP_BUILD ?= "0"
XEN_EXTRA_PACKAGES = ""
XEN_EXTRA_PACKAGES:append = "${@'kernel-module-xen-blkback kernel-module-xen-gntalloc kernel-module-xen-gntdev kernel-module-xen-netback kernel-module-xen-wdt xen xen-tools xen-tools-xenstat ' if d.getVar('HYP_BUILD') == '1' else ''}"
IMAGE_INSTALL:append:agilex5_dk_a5e013bm16aea = "${@' socfpga-xen-passthrough' if d.getVar('HYP_BUILD') == '1' else ''}"
IMAGE_BOOT_FILES:append:agilex5_dk_a5e013bm16aea = "${@' xen Image devicetree/socfpga_agilex5_vanilla_013b.dtb boot.scr.xen.uimg agilex5_dk_a5e013bm16aea_gsrd_ghrd/ghrd.core.rbf' if d.getVar('HYP_BUILD') == '1' else ''}"

