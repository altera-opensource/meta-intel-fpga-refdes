#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex5
#@DESCRIPTION: Additional machine configuration for the Agilex5 SoCFPGA

IMAGE_TYPE:agilex5_mk_a5e065bb32aes1 ?= "gsrd"

UBOOT_CONFIG:agilex5_mk_a5e065bb32aes1 ?= "agilex5_mk_a5e065bb32aes1-socdk-atf"

KERNEL_DEVICETREE = " "

IMAGE_INSTALL:append:agilex5_mk_a5e065bb32aes1 = " \
		${@bb.utils.contains( 'IMAGE_BASENAME', "gsrd-console-image", " packagegroup-tsn-essential", "", d)} \
		"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:agilex5_mk_a5e065bb32aes1 = " \
		kernel-modules \
		device-tree \
		hw-ref-design \
		"

EXTRA_IMAGEDEPENDS:append:agilex5_mk_a5e065bb32aes1 = " \
		u-boot-socfpga-scr \
		"

IMAGE_BOOT_FILES:agilex5_mk_a5e065bb32aes1 = " \
		boot.scr.uimg \
		u-boot.itb \
		kernel.itb \
		"
HYP_BUILD ?= "0"
XEN_EXTRA_PACKAGES = ""
XEN_EXTRA_PACKAGES:append = "${@'kernel-module-xen-blkback kernel-module-xen-gntalloc kernel-module-xen-gntdev kernel-module-xen-netback kernel-module-xen-wdt xen xen-tools xen-tools-xenstat ' if d.getVar('HYP_BUILD') == '1' else ''}"
IMAGE_INSTALL:append:agilex5_mk_a5e065bb32aes1 = "${@' socfpga-xen-passthrough' if d.getVar('HYP_BUILD') == '1' else ''}"
IMAGE_BOOT_FILES:append:agilex5_mk_a5e065bb32aes1 =  "${@' xen Image devicetree/socfpga_agilex5_vanilla_modular.dtb  boot.scr.xen.uimg agilex5_mk_a5e065bb32aes1_gsrd_ghrd/ghrd.core.rbf' if d.getVar('HYP_BUILD') == '1' else ''}"
