#@TYPE: Machine
#@NAME: Intel SoCFPGA Agilex3
#@DESCRIPTION: Additional machine configuration for the Agilex3 SoCFPGA

IMAGE_TYPE:agilex3 ?= "gsrd"

UBOOT_CONFIG:agilex3 ?= "agilex3-socdk-atf"

KERNEL_DEVICETREE = " "

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:agilex3 = " \
		kernel-modules \
		device-tree \
		hw-ref-design \
		"

EXTRA_IMAGEDEPENDS:append:agilex3 = " \
		u-boot-socfpga-scr \
		"

IMAGE_BOOT_FILES:agilex3 = " \
		boot.scr.uimg \
		u-boot.itb \
		kernel.itb \
		"
HYP_BUILD ?= "0"
XEN_EXTRA_PACKAGES = ""
XEN_EXTRA_PACKAGES:append = "${@'kernel-module-xen-blkback kernel-module-xen-gntalloc kernel-module-xen-gntdev kernel-module-xen-netback kernel-module-xen-wdt xen xen-tools xen-tools-xenstat ' if d.getVar('HYP_BUILD') == '1' else ''}"
IMAGE_INSTALL:append:agilex3 = "${@' socfpga-xen-passthrough' if d.getVar('HYP_BUILD') == '1' else ''}"
IMAGE_BOOT_FILES:append:agilex3 = "${@' xen Image devicetree/socfpga_agilex3_vanilla.dtb boot.scr.xen.uimg boot.scr.xen.emmc.uimg boot.scr.xen.debug.uimg agilex3_gsrd_ghrd/ghrd.core.rbf' if d.getVar('HYP_BUILD') == '1' else ''}"

